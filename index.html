<!DOCTYPE html>
<html lang="en">
<head>

    <title>SLEXPOSE – Security Research</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 255, 255, 0.6),
                0 0 40px rgba(255, 255, 255, 0.3),
                0 0 80px rgba(255, 255, 255, 0.1);

        }

        .tagline {
            font-size: 1.5rem;
            color: #cccccc;
            margin-bottom: 2rem;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .blog-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .blog-badge {
            display: inline-block;
            border: 1px solid #ffffff;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.1),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .blog-badge:hover {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .subtext {
            color: #aaaaaa;
            font-size: 0.9rem;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .footer {
            margin-top: 3rem;
            color: #444444;
            font-size: 0.8rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.05);
        }

        /* Version stamp - bottom right */
        .version {
            position: fixed;
            bottom: 12px;
            right: 16px;
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 10px;
            color: #333333;
            letter-spacing: 0.06em;
            user-select: none;
        }
    </style>
